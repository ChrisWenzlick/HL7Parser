name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (.NET ${{ matrix.dotnet-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        dotnet-version:
          - '8.0'
          - '9.0'
          - '10.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test tests/HL7Parser.Tests.Unit --no-build --configuration Release --framework net${{ matrix.dotnet-version }} --verbosity normal

      - name: Run integration tests
        run: dotnet test tests/HL7Parser.Tests.Integration --no-build --configuration Release --framework net${{ matrix.dotnet-version }} --verbosity normal