name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: Pack, Test, and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Derive package version from tag
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v0.0.0-dryrun"
            echo "::notice::Not a tag push (workflow_dispatch) — using placeholder version '$TAG' for a dry run. Publish and release-creation steps will be skipped."
          fi
          VERSION="${TAG#v}"
          echo "Derived version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify NUGET_API_KEY secret is set
        if: github.ref_type == 'tag'
        run: |
          if [ -z "${{ secrets.NUGET_API_KEY }}" ]; then
            echo "::error::NUGET_API_KEY secret is not set. Add it in the repository's Actions secrets before pushing a release tag. See docs/RELEASING.md."
            exit 1
          fi

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution (Release)
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests (net8.0)
        run: dotnet test tests/HL7Parser.Tests.Unit --no-build --configuration Release --framework net8.0 --verbosity normal

      - name: Run unit tests (net9.0)
        run: dotnet test tests/HL7Parser.Tests.Unit --no-build --configuration Release --framework net9.0 --verbosity normal

      - name: Run unit tests (net10.0)
        run: dotnet test tests/HL7Parser.Tests.Unit --no-build --configuration Release --framework net10.0 --verbosity normal

      - name: Run integration tests (net8.0)
        run: dotnet test tests/HL7Parser.Tests.Integration --no-build --configuration Release --framework net8.0 --verbosity normal

      - name: Run integration tests (net9.0)
        run: dotnet test tests/HL7Parser.Tests.Integration --no-build --configuration Release --framework net9.0 --verbosity normal

      - name: Run integration tests (net10.0)
        run: dotnet test tests/HL7Parser.Tests.Integration --no-build --configuration Release --framework net10.0 --verbosity normal

      - name: Pack
        run: >
          dotnet pack src/HL7Parser.Application/HL7Parser.Application.csproj
          --no-build
          --configuration Release
          -p:Version=${{ steps.version.outputs.version }}
          --output ./artifacts

      - name: Extract release notes from CHANGELOG.md
        if: github.ref_type == 'tag'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v ver="$VERSION" '
            BEGIN { found=0 }
            /^## \[/ {
              if (found) exit
              if ($0 ~ "^## \\[" ver "\\]") { found=1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for version '$VERSION' (expected a '## [$VERSION] - YYYY-MM-DD' heading). Rename '## [Unreleased]' to '## [$VERSION] - YYYY-MM-DD' and commit it to main before tagging. See docs/RELEASING.md."
            exit 1
          fi

      - name: Publish to NuGet
        if: github.ref_type == 'tag'
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
